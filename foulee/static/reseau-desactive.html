<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Foulée</title>
<style>
  :root { --page: #f2f5f3; --surface: #ffffff; --ink: #15201b; --muted: #5d6b64; --hair: #d9e0dc; --bark: #4b3e34; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #101614; --surface: #18201d; --ink: #e4ebe7; --muted: #9aa8a1; --hair: #2a3530; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 26px 24px; }
  .chip { width: 32px; height: 24px; border-radius: 5px; background: var(--bark); display: grid; align-content: center; gap: 2px; padding: 0 5px; margin-bottom: 16px; }
  .chip i { display: block; height: 6px; border-radius: 1px; background: #fff; }
  .chip i + i { background: #d3263a; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 10px; color: var(--muted); }
  b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <span class="chip" aria-hidden="true"><i></i><i></i></span>
  <h1>L'accès par le réseau local est désactivé</h1>
  <p>Pour l'activer, ouvre Foulée par Tailscale, puis <b>Réglages → Accès depuis le réseau local</b>, et choisis un mot de passe.</p>
  <p>Par Tailscale, Foulée reste disponible sans mot de passe, depuis n'importe où.</p>
</main>
</body>
</html>
