<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4b3e34">
<title>Foulée · connexion</title>
<style>
  :root { --page: #f2f5f3; --surface: #ffffff; --ink: #15201b; --muted: #5d6b64; --hair: #d9e0dc; --bark: #4b3e34; --bad: #b02a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #101614; --surface: #18201d; --ink: #e4ebe7; --muted: #9aa8a1; --hair: #2a3530; --bad: #ef6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 26px 24px 20px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 22px; margin-bottom: 20px; }
  .chip { width: 32px; height: 24px; border-radius: 5px; background: var(--bark); display: grid; align-content: center; gap: 2px; padding: 0 5px; }
  .chip i { display: block; height: 6px; border-radius: 1px; background: #fff; }
  .chip i + i { background: #d3263a; }
  label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; color: var(--muted); }
  input { font: inherit; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--hair); background: var(--page); color: var(--ink); }
  button { margin-top: 16px; width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 9px;
           background: var(--bark); color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .msg { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--bad); }
  .note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
</style>
</head>
<body>
<form id="login">
  <div class="brand"><span class="chip" aria-hidden="true"><i></i><i></i></span>Foulée</div>
  <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <button type="submit">Entrer</button>
  <p class="msg" id="msg" role="alert"></p>
  <p class="note">Accès depuis le réseau de la maison. Par Tailscale, aucun mot de passe n'est demandé.</p>
</form>
<script>
  const form = document.getElementById("login");
  const msg = document.getElementById("msg");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    msg.textContent = "";
    form.querySelector("button").disabled = true;
    let response = null;
    try {
      response = await fetch("/api/connexion", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Foulee": "1" },
        body: JSON.stringify({ mot_de_passe: form.password.value }),
      });
    } catch (error) { /* serveur injoignable */ }
    form.querySelector("button").disabled = false;
    if (response && response.ok) { location.replace("/"); return; }
    let detail = "Le serveur Foulée ne répond pas.";
    if (response) {
      try { detail = (await response.json()).detail; } catch (error) { detail = `Erreur ${response.status}`; }
    }
    msg.textContent = detail;
    form.password.select();
  });
</script>
</body>
</html>
