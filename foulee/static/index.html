<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foulée</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182020'/%3E%3Crect x='8' y='6' width='5.5' height='20' rx='1.2' fill='%23fff'/%3E%3Crect x='8' y='6' width='16.5' height='5.5' rx='1.2' fill='%23fff'/%3E%3Crect x='8' y='14.5' width='12.5' height='5.5' rx='1.2' fill='%23d3263a'/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#182020">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <script>
    try {
      const t = localStorage.getItem("foulee-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) { /* stockage indisponible : thème du système */ }
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail" aria-label="Navigation">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="28" height="28" class="logo"><rect width="32" height="32" rx="7" fill="#182020"/><rect x="8" y="6" width="5.5" height="20" rx="1.2" fill="#fff"/><rect x="8" y="6" width="16.5" height="5.5" rx="1.2" fill="#fff"/><rect x="8" y="14.5" width="12.5" height="5.5" rx="1.2" fill="#d3263a"/></svg></span><span class="brand-name">Foulée</span></div>
      <nav class="nav" id="nav" aria-label="Vues"></nav>
      <div class="rail-foot">
        <nav class="rail-help" aria-label="Aide et retours">
          <a class="nav-item" id="help-link" href="#/aide">Aide et FAQ</a>
          <a class="rail-feedback" id="feedback-link" href="#/retours">Un bug, une idée ? Parles-en !</a>
        </nav>
        <div class="sync-line" id="sync-line" aria-live="polite"></div>
        <div class="progress" id="sync-progress" hidden><span></span></div>
        <button class="btn btn-primary btn-block" id="sync-btn" type="button"></button>
        <div class="rail-actions">
          <button class="btn btn-ghost" id="settings-btn" type="button"></button>
          <button class="btn btn-ghost icon-btn" id="theme-btn" type="button"></button>
        </div>
      </div>
    </aside>
    <div class="main" id="main">
      <div class="topbar">
        <button class="btn btn-ghost icon-btn" id="menu-btn" type="button" aria-label="Ouvrir le menu"></button>
        <span class="brand-mark" data-size="24" aria-hidden="true"><svg viewBox="0 0 32 32" width="24" height="24" class="logo"><rect width="32" height="32" rx="7" fill="#182020"/><rect x="8" y="6" width="5.5" height="20" rx="1.2" fill="#fff"/><rect x="8" y="6" width="16.5" height="5.5" rx="1.2" fill="#fff"/><rect x="8" y="14.5" width="12.5" height="5.5" rx="1.2" fill="#d3263a"/></svg></span><span class="brand-name">Foulée</span>
        <div class="conn" role="group" aria-label="Connexions"></div>
      </div>
      <div id="demo-strip"></div>
      <div class="update-alert" id="update-alert" hidden></div>
      <div id="page"><p class="tile-msg" style="position:static;padding:60px 0">Chargement…</p></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
