[project]
name = "foulee"
version = "0.8.3b12"
description = "Foulée — hub local de données sport et santé (Garmin d'abord)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python>=1.0.0",
    "garmin-fit-sdk>=21.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.10",
    "keyring>=25; sys_platform == 'win32' or sys_platform == 'darwin'",  # Gestionnaire d'identification, Trousseau
    "pystray>=0.19.5 ; sys_platform == 'win32' or sys_platform == 'darwin'",  # icône près de l'horloge / des menus
    "tzdata>=2024.1 ; sys_platform == 'win32'",  # fuseaux horaires (heures des mesures Withings) : absents de Windows
    "pillow>=11",
    "segno>=1.6",
    "cryptography>=44",  # relais : les autorisations Garmin des élèves, chiffrées dans sa base
]

[project.scripts]
foulee = "foulee.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foulee"]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.45", "httpx>=0.27"]
