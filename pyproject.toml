[project]
name = "foulee"
version = "0.4.1"
description = "Foulée — hub local de données sport et santé (Garmin d'abord)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python>=1.0.0",
    "garmin-fit-sdk>=21.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.10",
    "keyring>=25; sys_platform == 'win32'",
    "pystray>=0.19.5 ; sys_platform == 'win32'",
    "pillow>=11 ; sys_platform == 'win32'",
]

[project.scripts]
foulee = "foulee.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foulee"]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.45", "httpx>=0.27"]
