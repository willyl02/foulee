# Application Windows : tests sous Windows, installateur Foulee-Setup-<version>.exe, essai complet
# (installation, relance, Claude, mise à jour, désinstallation), puis publication sur GitHub.
#
# Publier = changer le numéro de version (foulee/__init__.py, pyproject.toml, CHANGELOG.md) :
# - une bêta (0.5.0b1, a ou rc aussi) poussée sur la branche beta devient une pré-version ;
# - une version finale (0.5.0) poussée sur main devient la version stable.
# Tant que la version publiée existe déjà, un envoi ne coûte qu'une petite vérification.
name: Windows

on:
  push:
    branches: [main, beta]
    paths:
      - "foulee/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "CHANGELOG.md"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version à publier ?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' foulee/__init__.py)
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$version" != "$project" ]; then
            echo "::error title=Version::foulee/__init__.py ($version) et pyproject.toml ($project) diffèrent"
            exit 1
          fi
          prerelease=false
          if [[ "$version" =~ (a|b|rc)[0-9]*$ ]]; then prerelease=true; fi
          # Une bêta sort de la branche beta, une version stable de main
          channel_ok=false
          if [ "$BRANCH" = "beta" ] && [ "$prerelease" = true ]; then channel_ok=true; fi
          if [ "$BRANCH" = "main" ] && [ "$prerelease" = false ]; then channel_ok=true; fi
          exists=false
          if gh release view "v$version" >/dev/null 2>&1; then exists=true; fi
          build=false; publish=false
          if [ "$EVENT" = "workflow_dispatch" ]; then build=true; fi
          if [ "$exists" = false ] && [ "$channel_ok" = true ]; then build=true; publish=true; fi
          if [ "$exists" = false ] && [ "$channel_ok" = false ]; then
            echo "::notice title=Pas de publication::$version sur la branche $BRANCH : une bêta se publie depuis beta, une version stable depuis main"
          fi
          echo "Version $version (bêta : $prerelease), déjà publiée : $exists → construire : $build, publier : $publish"
          {
            echo "version=$version"
            echo "build=$build"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (Windows)
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Bibliothèques
        run: uv sync --frozen
      - name: Tests
        run: |
          $ErrorActionPreference = "Continue"
          $env:PYTHONUTF8 = "1"
          uv run --frozen pytest -q -p no:cacheprovider -rfE 2>&1 | Tee-Object -FilePath tests.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Les journaux ne se lisent pas toujours de l'extérieur : le résumé part dans une annotation
            $tail = ((Get-Content tests.log -Tail 70) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Tests Windows::$tail"
            exit $code
          }

  installateur:
    name: Installateur
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Inno Setup
        run: |
          choco upgrade innosetup -y --no-progress | Select-Object -Last 3
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          Write-Host "Inno Setup $((Get-Item $iscc).VersionInfo.ProductVersion)"
      - name: Construction
        run: |
          try {
            ./packaging/build.ps1 *>&1 | Tee-Object -FilePath build.log
          } catch {
            $_ | Out-String | Add-Content build.log
            $tail = ((Get-Content build.log -Tail 60) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Construction::$tail"
            exit 1
          }
      - name: Essai complet de l'installateur
        run: ./packaging/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Foulee-Setup
          path: build/out/*
          if-no-files-found: error

  publication:
    name: Publication
    needs: [version, tests, installateur]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Foulee-Setup
          path: out
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 packaging/notes_de_version.py "$VERSION" > notes.md
          (cd out && sha256sum -c SHA256SUMS.txt)
          flags=(--target "$GITHUB_SHA" --title "Foulée $VERSION" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "v$VERSION" out/* "${flags[@]}"
          echo "::notice title=Publié::Foulée $VERSION est en ligne (étiquette v$VERSION)"
