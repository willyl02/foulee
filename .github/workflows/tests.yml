# Tests à chaque envoi sur main (stable) et beta (avant-premières).
name: Tests

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Bibliothèques
        run: uv sync --frozen
      - name: Tests
        run: uv run --frozen pytest -q -p no:cacheprovider
